<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Scene Narrator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <video id="video" playsinline muted autoplay></video>
  <canvas id="canvas" hidden></canvas>

  <header class="top">
    <span id="status" class="status">Idle</span>
    <span id="latency" class="latency"></span>
    <button id="flip" class="icon" aria-label="Switch camera">⇄</button>
  </header>

  <section class="caption" aria-live="polite">
    <p id="current" class="current">Tap Start to describe your surroundings.</p>
    <ol id="history" class="history"></ol>
  </section>

  <footer class="controls">
    <span></span>
    <button id="start" class="start">Start</button>
    <label class="gap">
      <span>Gap <output id="gapOut">0s</output></span>
      <input id="gap" type="range" min="0" max="5000" step="250" value="0">
    </label>
  </footer>

  <script src="app.js"></script>
</body>
</html>
