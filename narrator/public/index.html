<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Scene Narrator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <video id="video" playsinline muted autoplay></video>
  <canvas id="canvas" hidden></canvas>

  <header class="top">
    <span id="status" class="status">Idle</span>
    <span id="latency" class="latency"></span>
    <span id="lens" class="latency"></span>
    <span id="voiceStatus" class="latency"></span>
    <button id="debugBtn" class="icon" aria-label="Show diagnostics" aria-pressed="false">🐞</button>
    <button id="flip" class="icon" aria-label="Switch camera">⇄</button>
  </header>

  <div id="debug" class="debug" hidden>
    <figure class="debug-frame">
      <img id="debugFrame" alt="Last frame sent to Perceptron">
      <figcaption>sent to Perceptron</figcaption>
    </figure>
    <pre id="debugText"></pre>
  </div>

  <section class="caption" aria-live="polite">
    <p id="current" class="current">Tap Start to describe your surroundings.</p>
    <ol id="history" class="history"></ol>
  </section>

  <footer class="controls">
    <div class="toggles">
      <label class="toggle"><input id="voice" type="checkbox" checked> <span>Voice</span></label>
      <label class="toggle"><input id="interrupt" type="checkbox"> <span>Interrupt</span></label>
    </div>
    <button id="start" class="start">Start</button>
    <label class="gap">
      <span>Frame every <output id="intervalOut">0.4s</output></span>
      <input id="interval" type="range" min="300" max="3000" step="100" value="400">
    </label>
  </footer>

  <script src="filter.js"></script>
  <script src="speech.js"></script>
  <script src="app.js"></script>
</body>
</html>
