<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Scene Narrator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <video id="video" playsinline muted autoplay></video>
  <canvas id="canvas" hidden></canvas>

  <header class="top">
    <span id="status" class="status">Idle</span>
    <span id="latency" class="latency"></span>
    <span id="lens" class="latency"></span>
    <span id="det" class="latency"></span>
    <button id="flip" class="icon" aria-label="Switch camera">⇄</button>
  </header>

  <section class="caption" aria-live="polite">
    <div class="box">
      <p id="current" class="current">Tap Start to describe your surroundings.</p>
      <p id="live" class="live"></p>
    </div>
    <ol id="history" class="history"></ol>
  </section>

  <footer class="controls">
    <span></span>
    <button id="start" class="start">Start</button>
    <label class="gap">
      <span>Frame every <output id="intervalOut">0.4s</output></span>
      <input id="interval" type="range" min="300" max="3000" step="100" value="400">
    </label>
  </footer>

  <script src="filter.js"></script>
  <script src="tracker.js"></script>
  <script src="detector.js"></script>
  <script src="app.js"></script>
</body>
</html>
